<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      margin: 0;
      padding: 20px;
      color: #333;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      background-color: #ffffff;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .header {
      background-color: #2c7bb6;
      color: white;
      padding: 24px 32px;
    }
    .header h1 {
      margin: 0 0 4px 0;
      font-size: 22px;
    }
    .header p {
      margin: 0;
      opacity: 0.85;
      font-size: 14px;
    }
    .section {
      padding: 24px 32px;
      border-bottom: 1px solid #e8e8e8;
    }
    .section:last-child {
      border-bottom: none;
    }
    .section h2 {
      margin: 0 0 16px 0;
      font-size: 16px;
      color: #2c7bb6;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .section img {
      width: 100%;
      border-radius: 4px;
    }
    .footer {
      background-color: #f9f9f9;
      padding: 16px 32px;
      font-size: 12px;
      color: #999;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Weekend Cycling Forecast</h1>
      <p>{date_label}</p>
    </div>

    <div class="section">
      <h2>Vienna → Budapest — Best Departure Time</h2>
      <img src="data:image/png;base64,{opt_fwd}" alt="Vienna to Budapest options">
    </div>

    <div class="section">
      <h2>Budapest → Vienna — Best Departure Time</h2>
      <img src="data:image/png;base64,{opt_back}" alt="Budapest to Vienna options">
    </div>

    <div class="section">
      <h2>Detailed Forecast</h2>
      <img src="data:image/png;base64,{forecasts}" alt="Detailed forecast">
    </div>

    <div class="footer">
      Generated by GitHub Actions · {date_generated}
    </div>
  </div>
</body>
</html>
