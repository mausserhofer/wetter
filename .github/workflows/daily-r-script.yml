name: Daily R Script

on:
  schedule:
    - cron: '0 3 * * 3'  # every Wednesday at 3:00 AM UTC
  workflow_dispatch:       # allows manual trigger

jobs:
  run-r-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Chromium
        run: sudo apt-get install -y chromium-browser

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install R packages
        run: |
          install.packages("pacman")
          pacman::p_load(httr2, data.table, gt, webshot2, base64enc, scales)
        shell: Rscript {0}

      - name: Run R script
        run: Rscript weather_weekend.R

      - name: Upload output
        uses: actions/upload-artifact@v4
        with:
          name: forecast-images
          path: |
            options.png
            options_back.png
            forecasts.png

      - name: Send email
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          python3 - <<'EOF'
          import smtplib, os
          from email.mime.multipart import MIMEMultipart
          from email.mime.text import MIMEText

          msg = MIMEMultipart('alternative')
          msg['Subject'] = 'Weekend Cycling Forecast'
          msg['From'] = os.environ['GMAIL_USER']
          msg['To'] = 'markus.ausserhofer@hotmail.com, gabsmonthi3@hotmail.com'

          with open('email_body.html') as f:
              html = f.read()
          msg.attach(MIMEText(html, 'html'))

          with smtplib.SMTP_SSL('smtp.gmail.com', 465) as s:
              s.login(os.environ['GMAIL_USER'], os.environ['GMAIL_PASSWORD'])
              s.send_message(msg)
          EOF
