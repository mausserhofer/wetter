name: Daily R Script

on:
  schedule:
    - cron: '0 7 * * *'  # every day at 7:00 AM UTC
  workflow_dispatch:       # allows manual trigger

jobs:
  run-r-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install R packages
        run: Rscript -e 'install.packages(c("dplyr"))' # your packages here

      - name: Run R script
        run: Rscript weather_weekend.R