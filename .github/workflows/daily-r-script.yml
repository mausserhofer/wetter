name: Daily R Script

on:
  schedule:
    - cron: '0 7 * * *'  # every day at 7:00 AM UTC
  workflow_dispatch:       # allows manual trigger

jobs:
  run-r-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Chromium
        run: sudo apt-get install -y chromium-browser

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install R packages
        run: |
          install.packages("pacman")
          pacman::p_load(httr2, data.table, gt, webshot2)
        shell: Rscript {0}

      - name: Run R script
        run: Rscript weather_weekend.R

      - name: Upload output
        uses: actions/upload-artifact@v4
        with:
          name: forecast-images
          path: |
            options.png
            forecasts.png

            - name: Send email with plots
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.GMAIL_USER }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "Daily R Script Results"
          to: markus.ausserhofer@hotmail.com
          from: ${{ secrets.GMAIL_USER }}
          body: "Your daily R script has completed. Plots attached!"
          attachments: "*.png"
